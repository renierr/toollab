name: tool_lab
description: "A multi-tool utility app with device sensors, calculator, and more."
publish_to: "none"
version: 1.7.2+47

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  go_router: ^17.3.0
  http: ^1.6.0
  rhttp:
    path: ./packages/rhttp
  file_selector: ^1.1.0
  share_plus: ^13.1.0
  sensors_plus: ^7.0.0
  device_info_plus: ^13.1.0
  battery_plus: ^7.0.0
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  sqlite3: ^3.5.0
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_soloud: ^4.0.6
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  pdfrx: ^2.4.3
  pdfrx_engine: ^0.4.2
  desktop_drop: ^0.8.0
  flutter_markdown_plus: ^1.0.7
  url_launcher: ^6.3.0
  package_info_plus: ^10.1.0
  pdf: ^3.12.0
  markdown: ^7.3.1
  image: ^4.9.1
  image_picker: ^1.2.2
  pasteboard: ^0.5.0
  archive: ^4.0.9
  crypto: ^3.0.7
  ffi: ^2.1.4
  pdfium_dart: ^0.2.5
  flutter_zxing: ^2.3.0
  google_mlkit_document_scanner: ^0.6.1
  google_mlkit_barcode_scanning: ^0.16.0
  google_mlkit_subject_segmentation: ^0.2.0
  camera: ^0.12.0+1
  geolocator: ^14.0.3
  google_mlkit_text_recognition: ^0.17.0
  flutter_onnxruntime: ^1.8.3
  google_mlkit_genai_prompt:
    path: ./packages/google_mlkit_genai_prompt
  docx_creator: ^1.2.7
  html2md: ^1.3.2
  universal_ble: ^2.1.0
  flutter_classic_bluetooth: ^0.1.2
  record: ^7.1.1
  dbus: ^0.7.14
  yaml: ^3.1.3
  ftpconnect: ^2.0.10
  dart_smb2: ^0.1.1
  flutter_secure_storage: ^10.3.1
  health_connector: ^3.9.4
  health_connector_core: ^3.9.2
  workmanager: ^0.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/
    - assets/google_fonts/
    - assets/audio/
    - assets/grammars/
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/logo/logo.png"
  linux:
    generate: true
    image_path: "assets/logo/logo.png"
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: "assets/logo/logo.png"

dependency_overrides:
  xml: ^7.0.1
