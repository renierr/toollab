name: tool_lab
description: "A multi-tool utility app with device sensors, calculator, and more."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  go_router: ^14.8.0
  sensors_plus: ^6.1.1
  device_info_plus: ^11.3.0
  battery_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/logo/logo.png"
  linux:
    generate: true
    image_path: "assets/logo/logo.png"
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: "assets/logo/logo.png"
